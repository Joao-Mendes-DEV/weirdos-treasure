# Configuração do Fly.io
# O nome do app é definido no "fly launch" (troque se já existir um igual).
app = "weirdos-treasure"

# São Paulo
primary_region = "gru"

[build]

# Variáveis que não são segredo (os segredos vão por "fly secrets")
[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  # Precisa ficar ligado 24h (chat da Twitch e prazos dos sorteios)
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/vivo"
    timeout = "5s"

# Máquina pequena (suficiente para este site)
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
