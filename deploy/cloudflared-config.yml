# Configuração do túnel da Cloudflare (copiar para /etc/cloudflared/config.yml)
# Troque TUNNEL_ID e SEU_DOMINIO pelos valores reais.

tunnel: TUNNEL_ID
credentials-file: /etc/cloudflared/TUNNEL_ID.json

ingress:
  - hostname: SEU_DOMINIO
    service: http://127.0.0.1:3000
  - hostname: www.SEU_DOMINIO
    service: http://127.0.0.1:3000
  - service: http_status:404
